</style></head><body>

<script>
const $=s=>document.querySelector(s),COL=['#3f5a24','#d9689a','#d4a017','#6f8f45','#c0624a','#4a8a8a','#8a6a3a','#7a5aa8'];
let S={subjects:[],logs:[]};try{S=JSON.parse(localStorage.getItem('sd'))||S}catch(e){}
const save=()=>{try{localStorage.setItem('sd',JSON.stringify(S))}catch(e){}},uid=()=>Math.random().toString(36).slice(2,9);
let db;const ready=new Promise(r=>{const q=indexedDB.open('sd',1);q.onupgradeneeded=()=>q.result.createObjectStore('pdf');q.onsuccess=()=>{db=q.result;r()}});
const idb=(m,f)=>new Promise(r=>{const q=f(db.transaction('pdf',m).objectStore('pdf'));q.onsuccess=()=>r(q.result)});
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d},hr=m=>(m/60).toFixed(1);
const sub=id=>S.subjects.find(s=>s.id==id),byDay=()=>{const o={};S.logs.forEach(l=>o[l.date]=(o[l.date]||0)+l.min);return o};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let view='dash',cur=null,tab='notes';
const NAV=[['dash','Dashboard'],['rt','Routine'],['subs','Subjects'],['lib','PDF Library'],['ana','Analytics']];
function go(v,id){view=v;cur=id||null;render();$('#m').scrollTop=0}
/* ---------- charts ---------- */
function bars(v,l,c='#3f5a24'){const W=520,H=190,m=Math.max(...v,.1),bw=W/v.length;
return`<svg viewBox="0 0 ${W} ${H}" width="100%">${v.map((x,i)=>{const h=x/m*(H-42);return`<rect x="${i*bw+bw*.2}" y="${H-24-h}" width="${bw*.6}" height="${h}" rx="5" fill="${c}" opacity="${x?1:.25}"/><text x="${i*bw+bw/2}" y="${H-7}" text-anchor="middle">${l[i]}</text>${x?`<text x="${i*bw+bw/2}" y="${H-30-h}" text-anchor="middle" style="fill:#2b3d1c">${x.toFixed(1)}</text>`:''}`}).join('')}</svg>`}
function donut(d){const t=d.reduce((a,b)=>a+b.v,0);if(!t)return'<div class="empty">Log a session to see the split.</div>';let o=0;const R=62,C=2*Math.PI*R;
return`<div class="row" style="gap:28px;flex-wrap:wrap"><svg viewBox="0 0 160 160" width="170"><g transform="rotate(-90 80 80)" fill="none" stroke-width="22">${d.map(x=>{const L=x.v/t*C,s=`<circle cx="80" cy="80" r="${R}" stroke="${x.c}" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-o}"/>`;o+=L;return s}).join('')}</g><text x="80" y="80" text-anchor="middle" style="fill:#2b3d1c;font:700 22px Bahnschrift,sans-serif">${hr(t)}h</text><text x="80" y="98" text-anchor="middle">total</text></svg><div class="legend" style="flex-direction:column;margin:0">${d.map(x=>`<div><b style="background:${x.c}"></b>${esc(x.n)} · ${hr(x.v)}h</div>`).join('')}</div></div>`}
function line(v){const W=520,H=190,m=Math.max(...v,1),p=v.map((x,i)=>[i/(v.length-1)*(W-20)+10,H-26-x/m*(H-46)]),pts=p.map(a=>a.join(',')).join(' ');
return`<svg viewBox="0 0 ${W} ${H}" width="100%"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5a24" stop-opacity=".4"/><stop offset="1" stop-color="#3f5a24" stop-opacity="0"/></linearGradient></defs><polygon points="10,${H-26} ${pts} ${W-10},${H-26}" fill="url(#lg)"/><polyline points="${pts}" fill="none" stroke="#3f5a24" stroke-width="2.5" stroke-linejoin="round"/><text x="10" y="${H-8}">30 days ago</text><text x="${W-10}" y="${H-8}" text-anchor="end">today · ${v[v.length-1].toFixed(1)}h total</text></svg>`}
function heat(){const b=byDay(),cells=[];const st=ago(83+((new Date().getDay()+6)%7)*0);for(let i=83;i>=0;i--){const d=ago(i),m=b[dk(d)]||0,a=m?Math.min(1,.25+m/240):0;cells.push(`<i title="${dk(d)}: ${m} min" style="${a?`background:rgba(63,90,36,${a})`:''}"></i>`)}
return`<div class="heat" style="grid-template-columns:repeat(12,1fr)">${cells.join('')}</div><div class="sub" style="font-size:12px;margin-top:8px">Last 12 weeks · darker = more minutes</div>`}
function hb(rows){return rows.length?rows.map(r=>`<div style="margin-bottom:14px"><div class="row sp"><span>${esc(r.n)}</span><span class="sub">${r.t}</span></div><div class="bar" style="--c:${r.c}"><i style="width:${Math.min(100,r.p)}%"></i></div></div>`).join(''):'<div class="empty">Add subjects to track progress.</div>'}
/* ---------- data helpers ---------- */
const subMin=id=>S.logs.filter(l=>l.sid==id).reduce((a,l)=>a+l.min,0);
const pct=s=>s.topics.length?Math.round(s.topics.filter(t=>t.done).length/s.topics.length*100):0;
function streak(){const b=byDay();let n=0,i=b[dk(ago(0))]?0:1;while(b[dk(ago(i))]){n++;i++}return n}
function weekMin(id){const from=dk(ago(6));return S.logs.filter(l=>l.date>=from&&(!id||l.sid==id)).reduce((a,l)=>a+l.min,0)}
const days=n=>[...Array(n)].map((_,i)=>ago(n-1-i)),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayHrs=n=>{const b=byDay();return days(n).map(d=>(b[dk(d)]||0)/60)};
function nextExam(){const t=dk(new Date()),e=S.subjects.filter(s=>s.exam&&s.exam>=t).sort((a,b)=>a.exam>b.exam?1:-1)[0];return e?{e,d:Math.round((new Date(e.exam)-new Date(t))/864e5)}:null}
const split=()=>S.subjects.map(s=>({n:s.name,v:subMin(s.id),c:s.color})).filter(x=>x.v);
/* ---------- views ---------- */
function logForm(){return S.subjects.length?`<div class="row" style="flex-wrap:wrap"><select id="ls">${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="lm" type="number" min="1" placeholder="Minutes" style="width:110px"><input id="ld" type="date" value="${dk(new Date())}"><button class="btn" onclick="addLog()">Log session</button></div>`:'<div class="empty">Add a subject first, then log your study time here.</div>'}
function dash(){const all=S.subjects.flatMap(s=>s.topics),dn=all.filter(t=>t.done).length,ne=nextExam();
return`<div class="top"><div><h1>Dashboard</h1><div class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</div></div><button class="btn" onclick="addSub()">+ New subject</button></div>
<div class="grid g4"><div class="card stat"><span>Studied this week</span><div class="num">${hr(weekMin())}h</div></div>
<div class="card stat"><span>Day streak</span><div class="num">${streak()}</div></div>
<div class="card stat"><span>Syllabus done</span><div class="num">${all.length?Math.round(dn/all.length*100):0}%</div></div>
<div class="card stat"><span>${ne?'Next exam · '+esc(ne.e.name):'Next exam'}</span><div class="num">${ne?ne.d+' days':'—'}</div></div></div>
<div class="grid g2" style="margin-top:16px"><div class="card"><h2>Last 7 days (hours)</h2>${bars(dayHrs(7),days(7).map(d=>DN[d.getDay()]))}</div>
<div class="card"><h2>Time by subject</h2>${donut(split())}</div></div>
<div class="card" style="margin-top:16px"><h2>Log a study session</h2>${logForm()}</div>`}
const pdfList=s=>s.pdfs.map(p=>`<div class="item"><span>📄</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span><span class="sub" style="white-space:nowrap">${(p.size/1048576).toFixed(2)} MB</span><button class="btn sm g" style="margin-left:auto" onclick="openPdf('${p.id}','${esc(p.name).replace(/'/g,'')}')">Open</button><button class="x" style="margin-left:0" onclick="delPdf('${s.id}','${p.id}')">✕</button></div>`).join('')||'<div class="empty">No PDFs attached yet.</div>';
const drop=id=>`<div class="drop" onclick="pick('${id}')" ondragover="event.preventDefault();this.classList.add('hot')" ondragleave="this.classList.remove('hot')" ondrop="event.preventDefault();addPdf(event.dataTransfer.files,'${id}')"><b>+ Attach PDF</b><br><span class="sub">Click here or drag PDF files onto this box</span></div>`;
function subs(){return`<div class="top"><div><h1>Subjects</h1><div class="sub">${S.subjects.length} total</div></div><button class="btn" onclick="addSub()">+ New subject</button></div>
${S.subjects.length?`<div class="grid g3">${S.subjects.map(s=>`<div class="card subj" style="--c:${s.color}" onclick="go('sub','${s.id}')"><h2>${esc(s.name)}</h2><div class="row sp sub"><span>${pct(s)}% topics done</span><span>${hr(subMin(s.id))}h studied</span></div><div class="bar" style="margin:10px 0"><i style="width:${pct(s)}%"></i></div>
<div class="sub" style="font-size:12px;margin-bottom:8px">${s.pdfs.length} PDF${s.pdfs.length==1?'':'s'} attached${s.exam?' · exam '+s.exam:''}</div>${s.pdfs.slice(0,3).map(p=>`<div class="chip">📄 ${esc(p.name)}</div>`).join('')}${s.pdfs.length>3?`<div class="sub" style="font-size:12px">+${s.pdfs.length-3} more</div>`:''}
<button class="btn sm g" style="margin-top:10px" onclick="event.stopPropagation();pick('${s.id}')">+ Attach PDF</button></div>`).join('')}</div>`:'<div class="empty">No subjects yet. Click “+ New subject”, then attach your PDF notes to it.</div>'}`}
function detail(){const s=sub(cur);if(!s)return go('subs'),'';
return`<div class="top"><div><button class="btn g sm" onclick="go('subs')">← Subjects</button><h1 style="margin-top:12px;border-left:5px solid ${s.color};padding-left:12px">${esc(s.name)}</h1></div><button class="btn g sm" onclick="delSub()">Delete subject</button></div>
<div class="grid g3" style="margin-bottom:16px"><div class="card stat"><span>Topics done</span><div class="num">${pct(s)}%</div></div><div class="card stat"><span>Hours studied</span><div class="num">${hr(subMin(s.id))}h</div></div><div class="card stat"><span>This week / target</span><div class="num">${hr(weekMin(s.id))} / ${s.target||0}h</div></div></div>
<div class="grid two" style="align-items:start"><div class="grid">
<div class="card"><h2>PDF notes (${s.pdfs.length})</h2>${drop(s.id)}<div style="margin-top:14px">${pdfList(s)}</div></div>
<div class="card"><h2>Written notes</h2><textarea placeholder="Write your notes here. They save automatically." oninput="sub('${s.id}').notes=this.value;save()">${esc(s.notes)}</textarea></div></div>
<div class="grid"><div class="card"><h2>Topics</h2><div class="row" style="margin-bottom:14px"><input id="tn" placeholder="Add a chapter or topic" style="flex:1;min-width:0" onkeydown="event.key=='Enter'&&addTopic()"><button class="btn" onclick="addTopic()">Add</button></div>${s.topics.map(t=>`<div class="item"><input type="checkbox" ${t.done?'checked':''} onchange="tog('${t.id}')"><span class="${t.done?'done':''}">${esc(t.t)}</span><button class="x" onclick="delTopic('${t.id}')">✕</button></div>`).join('')||'<div class="empty">Add topics and tick them off.</div>'}</div>
<div class="card"><h2>Sessions</h2>${S.logs.filter(l=>l.sid==s.id).sort((a,b)=>a.date<b.date?1:-1).slice(0,8).map(l=>`<div class="item"><span>${l.date}</span><span class="sub">${l.min} min</span><button class="x" onclick="delLog('${l.id}')">✕</button></div>`).join('')||'<div class="empty">No sessions logged yet. Use the Dashboard to log one.</div>'}</div></div></div>`}
function lib(){const n=S.subjects.reduce((a,s)=>a+s.pdfs.length,0);return`<div class="top"><div><h1>PDF Library</h1><div class="sub">${n} file${n==1?'':'s'} across ${S.subjects.length} subject${S.subjects.length==1?'':'s'}</div></div></div>`+(S.subjects.map(s=>`<div class="card" style="margin-bottom:16px;border-top:3px solid ${s.color}"><div class="row sp" style="margin-bottom:12px"><h2 style="margin:0">${esc(s.name)} <span class="sub">(${s.pdfs.length})</span></h2><button class="btn sm" onclick="pick('${s.id}')">+ Attach PDF</button></div>${pdfList(s)}</div>`).join('')||'<div class="empty">Create a subject first, then attach PDFs to it.</div>')}
function ana(){const b=byDay();let c=0;const cum=days(30).map(d=>c+=(b[dk(d)]||0)/60);
const wd=[0,0,0,0,0,0,0],cn=[0,0,0,0,0,0,0];Object.entries(b).forEach(([k,v])=>{wd[new Date(k+'T00:00').getDay()]+=v/60});
return`<div class="top"><div><h1>Analytics</h1><div class="sub">Your study patterns at a glance</div></div></div>
<div class="grid g2"><div class="card"><h2>Daily hours · last 14 days</h2>${bars(dayHrs(14),days(14).map(d=>d.getDate()),'#3f5a24')}</div>
<div class="card"><h2>Cumulative hours · 30 days</h2>${line(cum)}</div>
<div class="card"><h2>Time split by subject</h2>${donut(split())}</div>
<div class="card"><h2>Best study days (total hours)</h2>${bars(wd,DN,'#ffffff')}</div>
<div class="card"><h2>Syllabus completion</h2>${hb(S.subjects.map(s=>({n:s.name,c:s.color,p:pct(s),t:pct(s)+'%'})))}</div>
<div class="card"><h2>Weekly target vs actual</h2>${hb(S.subjects.filter(s=>s.target>0).map(s=>({n:s.name,c:s.color,p:weekMin(s.id)/60/s.target*100,t:hr(weekMin(s.id))+' / '+s.target+'h'})))}</div></div>
<div class="card" style="margin-top:16px"><h2>Consistency heatmap</h2>${heat()}</div>`}
const RT=()=>S.routine||(S.routine=[]),WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DF=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];let rv='day',rday=null;
const TI=()=>(new Date().getDay()+6)%7,dOf=i=>ago(TI()-i),tm=t=>{const[h,m]=t.split(':');return(+h%12||12)+':'+m+(+h<12?' AM':' PM')};
const mins=r=>{const f=t=>+t.slice(0,2)*60+ +t.slice(3,5);return Math.max(0,f(r.end)-f(r.start))},isDone=(r,i)=>!!(r.done&&r.done[dk(dOf(i))]),rtFor=d=>RT().filter(r=>r.days.includes(d)).sort((a,b)=>a.start>b.start?1:-1);
function rt(){const i=rday==null?TI():rday,list=rtFor(i),dn=list.filter(r=>isDone(r,i)).length;
const head=`<div class="top"><div><h1>Routine</h1><div class="sub">Plan each day and see your whole week</div></div><div class="row"><div class="seg"><button class="${rv=='day'?'on':''}" onclick="rv='day';render()">Daily</button><button class="${rv=='week'?'on':''}" onclick="rv='week';render()">Weekly</button></div><button class="btn" onclick="addRt()">+ Add routine</button></div></div>`;
if(rv=='day')return head+`<div class="pills">${WD.map((n,k)=>`<button class="${k==i?'on':''}" onclick="rday=${k};render()">${n}${k==TI()?' •':''}</button>`).join('')}</div><div class="card" style="margin-bottom:16px"><div class="row sp"><h2 style="margin:0">${DF[i]}</h2><span class="sub">${dn} of ${list.length} done</span></div><div class="bar" style="margin-top:12px"><i style="width:${list.length?dn/list.length*100:0}%"></i></div></div>`+(list.map(r=>{const s=sub(r.sid);return`<div class="item" style="border-left:4px solid ${s?s.color:'#3f5a24'}"><input type="checkbox" ${isDone(r,i)?'checked':''} onchange="rtTog('${r.id}',${i})"><div style="flex:1"><b class="${isDone(r,i)?'done':''}">${esc(r.title)}</b><div class="sub" style="font-size:12px">${tm(r.start)} – ${tm(r.end)}${s?' · '+esc(s.name):''}</div></div><button class="x" onclick="rtDel('${r.id}')">✕</button></div>`}).join('')||'<div class="empty">Nothing planned for this day. Click “+ Add routine”.</div>');
const tot=WD.reduce((a,_,k)=>a+rtFor(k).length,0),dd=WD.reduce((a,_,k)=>a+rtFor(k).filter(r=>isDone(r,k)).length,0),ph=WD.map((_,k)=>rtFor(k).reduce((a,r)=>a+mins(r),0)/60);
return head+`<div class="grid g3" style="margin-bottom:16px"><div class="card stat"><span>Blocks this week</span><div class="num">${tot}</div></div><div class="card stat"><span>Completed</span><div class="num">${tot?Math.round(dd/tot*100):0}%</div></div><div class="card stat"><span>Planned hours</span><div class="num">${ph.reduce((a,b)=>a+b,0).toFixed(1)}h</div></div></div>
<div style="overflow-x:auto;padding-bottom:6px"><div class="wk">${WD.map((n,k)=>`<div class="wcol ${k==TI()?'today':''}"><div class="wh" onclick="rday=${k};rv='day';render()"><b>${n}</b><span>${dOf(k).getDate()}</span></div>${rtFor(k).map(r=>{const s=sub(r.sid);return`<div class="wb ${isDone(r,k)?'dn':''}" style="--c:${s?s.color:'#3f5a24'}"><b>${tm(r.start)}</b>${esc(r.title)}</div>`}).join('')||'<div class="sub" style="font-size:12px;text-align:center;padding:10px">Free</div>'}</div>`).join('')}</div></div>
<div class="card" style="margin-top:16px"><h2>Planned hours per day</h2>${bars(ph,WD)}</div>`}
function addRt(){const d=$('#dlg');d.className='';const t0=rday==null?TI():rday;d.innerHTML=`<h2>New routine</h2><label>Title</label><input id="rtt" placeholder="e.g. Physics revision"><div class="row"><div style="flex:1"><label>Start</label><input id="rts" type="time" value="18:00"></div><div style="flex:1"><label>End</label><input id="rte" type="time" value="19:00"></div></div><label>Subject (optional)</label><select id="rsb"><option value="">None</option>${S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>Repeat on</label><div class="pills" id="rds" style="margin:0 0 8px">${WD.map((n,k)=>`<button type="button" class="${k==t0?'on':''}" onclick="this.classList.toggle('on')">${n}</button>`).join('')}</div><div class="row"><button class="btn g sm" onclick="rdAll([0,1,2,3,4,5,6])">Every day</button><button class="btn g sm" onclick="rdAll([0,1,2,3,4])">Weekdays</button></div><div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" onclick="mkRt()">Save routine</button></div>`;d.showModal()}
const rdAll=a=>document.querySelectorAll('#rds button').forEach((b,k)=>b.classList.toggle('on',a.includes(k)));
function mkRt(){const t=$('#rtt').value.trim(),days=[...document.querySelectorAll('#rds button')].flatMap((b,k)=>b.classList.contains('on')?[k]:[]);if(!t)return $('#rtt').focus();if(!days.length)return alert('Pick at least one day.');RT().push({id:uid(),title:t,start:$('#rts').value||'18:00',end:$('#rte').value||'19:00',sid:$('#rsb').value,days,done:{}});save();dlg.close();render()}
function rtTog(id,i){const r=RT().find(x=>x.id==id),k=dk(dOf(i));r.done=r.done||{};r.done[k]=!r.done[k];save();render()}
function rtDel(id){if(!confirm('Delete this routine from every day?'))return;S.routine=RT().filter(r=>r.id!=id);save();render()}
function render(){$('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${(view==k||(view=='sub'&&k=='subs'))?'on':''}" onclick="go('${k}')">${n}</button>`).join('');
const y=$('#m').scrollTop;$('#m').innerHTML={dash,subs,lib,rt,sub:detail,ana}[view]();$('#m').scrollTop=y}
/* ---------- actions ---------- */
function addSub(){const d=$('#dlg');d.className='';d.innerHTML=`<h2>New subject</h2><label>Name</label><input id="sn" placeholder="e.g. Physics">
<label>Weekly study target (hours)</label><input id="st" type="number" min="0" value="5"><label>Exam date (optional)</label><input id="se" type="date">
<div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn g" onclick="dlg.close()">Cancel</button><button class="btn" onclick="mkSub()">Create subject</button></div>`;d.showModal();$('#sn').focus()}
function mkSub(){const n=$('#sn').value.trim();if(!n)return $('#sn').focus();S.subjects.push({id:uid(),name:n,color:COL[S.subjects.length%COL.length],target:+$('#st').value||0,exam:$('#se').value,topics:[],notes:'',pdfs:[]});save();dlg.close();render()}
function delSub(){if(!confirm('Delete this subject, its notes and PDFs?'))return;const s=sub(cur);s.pdfs.forEach(p=>idb('readwrite',o=>o.delete(p.id)));S.subjects=S.subjects.filter(x=>x!=s);S.logs=S.logs.filter(l=>l.sid!=s.id);save();go('subs')}
function addLog(){const m=+$('#lm').value;if(!m)return $('#lm').focus();S.logs.push({id:uid(),sid:$('#ls').value,date:$('#ld').value||dk(new Date()),min:m});save();render()}
function delLog(i){S.logs=S.logs.filter(l=>l.id!=i);save();render()}
function addTopic(){const v=$('#tn').value.trim();if(!v)return;sub(cur).topics.push({id:uid(),t:v,done:false});save();render();$('#tn').focus()}
function tog(i){const t=sub(cur).topics.find(x=>x.id==i);t.done=!t.done;save();render()}
function delTopic(i){const s=sub(cur);s.topics=s.topics.filter(t=>t.id!=i);save();render()}
let pickSid=null;const pick=id=>{pickSid=id;$('#pf').click()};
async function addPdf(fs,sid){await ready;const s=sub(sid);if(!s)return;let bad=0;for(const f of fs){if(!/\.pdf$/i.test(f.name)){bad++;continue}const id=uid();await idb('readwrite',o=>o.put(f,id));s.pdfs.push({id,name:f.name,size:f.size})}save();render();if(bad)alert('Only PDF files can be attached.')}
async function delPdf(sid,i){if(!confirm('Remove this PDF?'))return;await ready;await idb('readwrite',o=>o.delete(i));const s=sub(sid);s.pdfs=s.pdfs.filter(p=>p.id!=i);save();render()}
async function openPdf(i,n){await ready;const f=await idb('readonly',o=>o.get(i));if(!f)return alert('File not found in this browser.');const u=URL.createObjectURL(new Blob([f],{type:'application/pdf'})),d=$('#dlg');d.className='big';
d.innerHTML=`<div class="row sp" style="margin-bottom:10px"><b>${n}</b><span class="row"><a class="btn g sm" href="${u}" target="_blank" style="text-decoration:none">Open full screen</a><button class="btn g sm" onclick="dlg.close()">Close</button></span></div><iframe src="${u}"></iframe>`;d.showModal();d.onclose=()=>{URL.revokeObjectURL(u);d.innerHTML=''}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='studydeck-backup-'+dk(new Date())+'.json';a.click()}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.subjects)throw 0;S=d;save();go('dash')}catch(x){alert('That file is not a StudyDeck backup.')}})};
function popHearts(){const p=$('#pets'),r=p.getBoundingClientRect(),x=r.left+r.width*.5,y=r.top+r.height*.3,H='<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 21C5.5 15.5 2.5 11.5 2.5 8.2 2.5 5.5 4.6 3.5 7 3.5c2 0 3.7 1.1 5 3 1.3-1.9 3-3 5-3 2.4 0 4.5 2 4.5 4.7 0 3.3-3 7.3-9.5 12.8z" fill="currentColor"/></svg>';
p.classList.remove('bump');void p.getBoundingClientRect();p.classList.add('bump');
for(let i=0;i<8;i++){const e=document.createElement('i');e.className='hrt';e.innerHTML=H;e.style.cssText=`left:${x}px;top:${y}px;animation-delay:${i*.16}s;color:${['#f08bb0','#f6a5c4','#e8629a','#f0c94a'][i%4]}`;document.body.appendChild(e);setTimeout(()=>e.remove(),i*160+1700)}}
ready.then(render);render();
</script></body></html>
